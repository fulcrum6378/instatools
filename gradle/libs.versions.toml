[versions]
agp = "8.7.3"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.29"
activityKtx = "1.10.0"
coreKtx = "1.15.0"
media3 = "1.5.1"
selection = "1.1.0"
room = "2.6.1"
swipeRefreshLayout = "1.1.0"
webkit = "1.12.1"
lottie = "6.6.0"
shimmer = "0.5.0"
glide = "4.16.0"
material = "1.12.0"
gson = "2.10.1"
dotsIndicator = "5.1.0"
commonsImaging = "1.0-alpha3"
commonsText = "1.11.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
ktx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
ktx-core = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
recyclerview-selection = { group = "androidx.recyclerview", name = "recyclerview-selection", version.ref = "selection" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swipeRefreshLayout" }
webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }
