plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 32
    buildToolsVersion '33.0.0'

    defaultConfig {
        applicationId 'ir.mahdiparastesh.instatools'
        minSdk 21
        targetSdk 32
        versionName '18.3'
    }

    signingConfigs {
        aleph {
            storeFile file('D:\\Experimental\\mahdiparastesh.jks')
            keyAlias 'instatools'
            storePassword "${System.getenv("JERK")}"
            keyPassword "${System.getenv("JERK")}"
        }
        beth {
            storeFile file('D:\\Experimental\\mahdiparastesh.jks')
            keyAlias 'instatools_beth'
            storePassword "${System.getenv("JERK")}"
            keyPassword "${System.getenv("JERK")}"
            // In Google Play: alias(Deployment Key)=>instatools, signing-key-alias=>instatools_beth
        }
    }

    flavorDimensions('store')
    productFlavors {
        all { dimension 'store' }
        iran {
            versionCode 54 // 38
            signingConfig signingConfigs.aleph
        }
        play {
            applicationIdSuffix '.beth'
            versionCode 23
            signingConfig signingConfigs.beth
            // Use BETH for Google Play; Use ALEPH for Galaxy Store
        }
    }
    sourceSets.iran { res.srcDirs = ['src/main/res', 'src/main/res_iran'] }
    sourceSets.play { res.srcDirs = ['src/main/res', 'src/main/res_play'] }

    buildTypes {
        debuggee {
            debuggable true
            minifyEnabled false
        }
        demo {
            debuggable true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    android.variantFilter { if (it.buildType.name in ['debug', 'androidTest']) it.setIgnore(true) }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
}

dependencies {
    def room_version = '2.4.2'
    def glide_version = '4.13.2'
    def media2_version = '1.2.1'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    implementation 'androidx.activity:activity-ktx:1.4.0' // Only for ActivityResultLauncher
    implementation 'org.apache.commons:commons-text:1.9' // StringEscapeUtils
    implementation 'com.airbnb.android:lottie:5.2.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'com.google.android.gms:play-services-ads:21.0.0'
    implementation "androidx.media2:media2-widget:$media2_version"
    implementation "androidx.media2:media2-player:$media2_version"
    //noinspection GradleDependency
    implementation 'com.tbuonomo:dotsindicator:4.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.2'
    implementation 'com.google.android.play:core:1.10.3'

    implementation 'com.github.fulcrum1378:ChipsLayoutManager:5140e08'
}
