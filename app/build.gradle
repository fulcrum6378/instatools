import com.android.builder.core.BuilderConstants

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 31

    defaultConfig {
        applicationId 'ir.mahdiparastesh.instatools'
        minSdk 21
        targetSdk 31
        versionName '11.6'
    }

    signingConfigs {
        aleph {
            storeFile file('D:\\Experimental\\mahdiparastesh.jks')
            keyAlias 'instatools'
            storePassword "${System.getenv("JERK")}"
            keyPassword "${System.getenv("JERK")}"
        }
        beth {
            storeFile file('D:\\Experimental\\mahdiparastesh.jks')
            keyAlias 'instatools_beth'
            storePassword "${System.getenv("JERK")}"
            keyPassword "${System.getenv("JERK")}"
            // In Google Play: alias(Deployment Key)=>instatools, signing-key-alias=>instatools_beth
        }
    }

    flavorDimensions('flaDim1')
    productFlavors {
        all { dimension 'flaDim1' }
        iran {
            versionCode 38
            signingConfig signingConfigs.aleph
        }
        play {
            applicationIdSuffix '.beth'
            versionCode 2
            signingConfig signingConfigs.beth
        }
    }
    sourceSets.iran {
        res.srcDirs = ['src/main/res', 'src/main/res_iran']
    }
    sourceSets.play {
        res.srcDirs = ['src/main/res', 'src/main/res_play']
    }

    buildTypes {
        debuggee {
            debuggable true
            minifyEnabled false
        }
        demo {
            debuggable true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    android.variantFilter { variant ->
        def build = variant.buildType.name
        if (build == BuilderConstants.DEBUG) { /* || build == BuilderConstants.RELEASE*/
            variant.setIgnore(true)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
}

dependencies {
    def room_version = '2.4.2'
    def glide_version = '4.13.1'
    def media2_version = '1.2.1'

    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    implementation 'androidx.activity:activity-ktx:1.4.0' // Only for ActivityResultLauncher
    implementation 'androidx.core:core-ktx:1.7.0' // For Iterable ViewGroup/Menu and Int:RGB
    implementation 'org.apache.commons:commons-text:1.9' // StringEscapeUtils
    implementation 'com.airbnb.android:lottie:5.0.3'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'com.google.android.gms:play-services-ads:20.6.0'
    implementation "androidx.media2:media2-widget:$media2_version"
    implementation "androidx.media2:media2-player:$media2_version"
    implementation 'com.tbuonomo:dotsindicator:4.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0-native-mt'
    implementation 'com.google.android.play:core:1.10.3'

    implementation 'ir.mahdiparastesh:chipslayoutmanager:0.4.0@aar'
}
